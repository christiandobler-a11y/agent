# Lokale Entwicklung. Die App selbst kommt in Schritt 9 (Deploy) dazu.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avelio
      POSTGRES_PASSWORD: avelio
      POSTGRES_DB: avelio
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avelio -d avelio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
