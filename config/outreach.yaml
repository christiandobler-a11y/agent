# Kontakt-Entwürfe (Phase 2, Baustein 1): Christians Positionierung und Schreibregeln. Grundlage für den späteren
# Entwurfs-Prompt (prompts/contact.v1.md). Stand 03.10.2026, mit Christian abgestimmt.

positionierung: >-
  Christian macht Online-Auftritte zeitgemäß, damit der erste (und zweite) Eindruck so stark ist wie der Betrieb
  selbst. Die Website ist online das erste Bild eines Betriebs. Kein Berufsetikett wie "Webdesigner aus XY".
  Direkt nach dem Befund kommt ein Kompliment mit Fakt, damit "zeitgemäß" nicht nach "veraltet" klingt.

# Gewählter Einstieg (Variante 2, 03.10.2026). Die anderen nur zur Abwechslung, damit nicht jede Mail gleich klingt.
einstieg: Ich heiße Christian und mache Online-Auftritte zeitgemäß. Für die meisten Kunden ist die Website ja das Erste, was sie von einem sehen.
einstiege_abwechslung:
  - Ich bin Christian und bring Websites auf den Stand von heute, damit der erste Eindruck online genauso stark ist wie der Betrieb selbst.
  - Ich bin Christian. Ich sorge dafür, dass ein guter Betrieb online auch so aussieht, zeitgemäß und auf dem Handy einfach zu bedienen.

aufhaenger: >-
  Ich habe etwas vorbereitet und würde es gern in 5 bis 10 Minuten gemeinsam durchgehen. Wann passt es diese Woche am
  besten? (Prototyp erst bauen, wenn eine Antwort kommt.)

regeln:
  - keine Gedankenstriche (– oder —), keine Aufzählungszeichen im Fließtext
  - professionell, aber locker und natürlich, wie 2023 geschrieben; kleine Umgangssprache erlaubt ("hab", "echt", "letztens")
  - genau ein konkreter, belegter Befund aus dem Audit, keine Mängelliste
  - ein Kompliment mit Fakt (z. B. Google-Bewertungen), damit klar ist, dass der Betrieb gut ist und nur die Website nicht mithält
  - E-Mail unter 120 Wörtern, reiner Text, höchstens ein Link, Betreff mit Bezug zum Betrieb, kein Werbebetreff
  - lokaler Bezug nur nebenbei, nicht als Etikett
  - Du oder Sie je nach Branche (Du z. B. Fahrrad, Gastro; Sie z. B. Physio, Hotel, Handwerk)
  - Nachfassen nach 5 Tagen kurz, mit offenem Ausstieg ("wenn es gerade nicht passt, melde ich mich nicht mehr")

kanaele:
  email: Kurz, Text, von Christians Postfach. Rechtlich heikel (UWG), Entscheidung liegt bei Christian.
  letter: >-
    "Befund-Seite": Handy-Screenshot der aktuellen Seite mit 2-3 roten, handschriftlich wirkenden Markierungen,
    daneben wenige handschriftlich wirkende Zeilen und ein QR-Code. Keine ausgedruckte Mail.
