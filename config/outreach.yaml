# Kontakt-Entwürfe (Phase 2, Baustein 1): Christians Positionierung und Schreibregeln. Grundlage für den späteren
# Entwurfs-Prompt (prompts/contact.v1.md). Stand 03.10.2026, mit Christian abgestimmt.

positionierung: >-
  Christian macht Online-Auftritte zeitgemäß, damit der erste (und zweite) Eindruck so stark ist wie der Betrieb
  selbst. Die Website ist online das erste Bild eines Betriebs. Kein Berufsetikett wie "Webdesigner aus XY".
  Direkt nach dem Befund kommt ein Kompliment mit Fakt, damit "zeitgemäß" nicht nach "veraltet" klingt.

absender_name: Christian Dobler
absender_zusatz: Websites für lokale Betriebe · Avelio, Peißenberg
# Letzte Zeile der Erstmail (04.10.2026, mail-tester: mehr Text neben dem Bild; bei Kaltakquise ohnehin üblich).
abmeldung:
  sie: Sie möchten keine weiteren Nachrichten von mir? Eine kurze Antwort genügt, dann melde ich mich nicht mehr.
  du: Du möchtest keine weiteren Nachrichten von mir? Eine kurze Antwort genügt, dann melde ich mich nicht mehr.
# Du für diese Branchen, sonst Sie.
du_branchen: [fahrrad, gastro, friseur, kosmetik]

# Warum eine gute Website für diese Branche zählt (04.10.2026, Christian): kein Angriff, sondern Tatsache. Viele
# Praxen sind ausgebucht, "mehr Patienten" zieht also nicht. 05.10.2026 (Christian, nach der ersten Abwesenheitsnotiz
# "komplett ausgelastet, keine neuen Patienten"): weg vom Argument "Kunden gehen sonst zum Nächsten", hin zum Bild nach
# außen und zu Bewerbern. Das LLM nimmt genau einen Nutzen, der zum Befund passt.
branche_kontext:
  physiotherapie: >-
    Die Website ist die Visitenkarte der Praxis nach außen: Wer sie anschaut, soll gleich sehen, wie gut und modern dort
    gearbeitet wird. Viele Praxen sind ausgelastet und nehmen keine neuen Patienten auf, um mehr Patienten geht es also
    nicht. Nutzen stattdessen: Bewerber (Physiotherapeuten sind gesucht und schauen sich zuerst die Website an, bevor
    sie sich bewerben), das Bild bei überweisenden Ärzten und bei Patienten, die die Praxis weiterempfehlen, ein
    Auftritt, der zur Qualität der Behandlung passt, und weniger Anrufe mit immer gleichen Fragen an der Anmeldung.

# Termin bestätigen (04.10.2026): Lead antwortet, Christian tippt den genannten Termin an, Avelio schreibt die
# Bestätigung (mit Kalender-Einladung) im selben Verlauf; gesendet wird per Knopf. Mit OUTREACH_MEETING_URL in der
# .env (z. B. ein fester Google-Meet- oder Zoom-Link) steht der Link gleich drin, sonst kommt er kurz vorher.
bestaetigung:
  text: "super, dann machen wir {termin}. {ablauf} Eine Kalender-Einladung hängt an, ich freu mich drauf."
  text_du: "super, dann machen wir {termin}. {ablauf} Eine Kalender-Einladung hängt an, ich freu mich drauf."
  # Ohne OUTREACH_MEETING_URL: Link kommt kurz vorher (Video-Call, damit Christian den Bildschirm teilen kann).
  ablauf_telefon: Den Link zum Video-Call (läuft einfach im Browser, nichts installieren) schicke ich Ihnen ein paar Minuten vorher, dann zeige ich Ihnen den Entwurf direkt am Bildschirm.
  ablauf_telefon_du: Den Link zum Video-Call (läuft einfach im Browser, nichts installieren) schick ich dir ein paar Minuten vorher, dann zeig ich dir den Entwurf direkt am Bildschirm.
  ablauf_link: "Hier schon mal der Link zum Video-Call, der läuft einfach im Browser, nichts installieren: {link}"
  ablauf_link_du: "Hier schon mal der Link zum Video-Call, der läuft einfach im Browser, nichts installieren: {link}"
  erinnerung_minuten: 30 # Telegram-Erinnerung vor dem Gespräch
  dauer_minuten: 15 # Länge des Kalendereintrags

# Ohne Namen mit Frau/Herr (Impressum, Firmenname) geht die Mail ans Team, mit der Bitte, sie an die
# Leitung weiterzugeben (04.10.2026, Christian: "Hallo Team Christina Heider Physiotherapeutin" ist zu generisch).
# Grußzeile mit Namen (04.10.2026, Christian: kein Vor- und Nachname, bayerisch "Grüß Gott, Frau Heider,";
# "Grüß Sie" wirkte geschrieben zu mündlich).
# Frau/Herr aus dem Impressum ("Frau", "Inhaberin", "Physiotherapeutin") oder einem eindeutigen Vornamen, sonst ans Team.
anrede:
  sie: "Grüß Gott, {anrede} {nachname},"
  du: "Servus {vorname},"
  ohne_name: "Grüß Gott, liebes Team von {firma},"
  # Steht im Impressum nur "Inhaber: Max Huber": Frau/Herr aus eindeutigen Vornamen (src/outreach/names.ts);
  # mehrdeutige (Toni, Kim …) gehen weiter ans Team. false = nur, was im Impressum steht.
  vorname_geschlecht: true

team_anrede:
  physiotherapie:
    anrede: "Liebes Praxisteam,"
    # steht als P.S. unter der Signatur
    weiterleiten: Falls sich bei Ihnen jemand anderes um die Website kümmert, leiten Sie das gern weiter.
    weiterleiten_du: Falls sich bei euch jemand anderes um die Website kümmert, leitet das gern weiter.

# Gewählter Einstieg (Variante 2, 03.10.2026). Die anderen nur zur Abwechslung, damit nicht jede Mail gleich klingt.
einstieg: Ich heiße Christian und mache Online-Auftritte zeitgemäß. Für die meisten Kunden ist die Website ja das Erste, was sie von einem sehen.
einstiege_abwechslung:
  - Ich bin Christian und bring Websites auf den Stand von heute, damit der erste Eindruck online genauso stark ist wie der Betrieb selbst.
  - Ich bin Christian. Ich sorge dafür, dass ein guter Betrieb online auch so aussieht, zeitgemäß, übersichtlich und einladend.

aufhaenger: >-
  Ich habe etwas vorbereitet und würde es gern in 5 bis 10 Minuten gemeinsam durchgehen. Wann passt es diese Woche am
  besten? (Prototyp erst bauen, wenn eine Antwort kommt.)

regeln:
  - keine Gedankenstriche (– oder —), keine Aufzählungszeichen im Fließtext
  - professionell, aber locker und natürlich, wie 2023 geschrieben; kleine Umgangssprache erlaubt ("hab", "echt", "letztens")
  - genau ein konkreter, belegter Befund aus dem Audit, keine Mängelliste
  - ein Kompliment mit Fakt (z. B. Google-Bewertungen), damit klar ist, dass der Betrieb gut ist und nur die Website nicht mithält
  - E-Mail unter 120 Wörtern, reiner Text, höchstens ein Link, Betreff mit Bezug zum Betrieb, kein Werbebetreff
  - lokaler Bezug nur nebenbei, nicht als Etikett
  - Du oder Sie je nach Branche (Du z. B. Fahrrad, Gastro; Sie z. B. Physio, Hotel, Handwerk)
  - Nachfassen nach 5 Tagen kurz, mit offenem Ausstieg ("wenn es gerade nicht passt, melde ich mich nicht mehr")

kanaele:
  email: Kurz, Text, von Christians Postfach. Rechtlich heikel (UWG), Entscheidung liegt bei Christian.
  letter: >-
    "Befund-Seite" (Abschnitt brief unten): Screenshot der Startseite am Rechner mit 2-3 roten, handschriftlich
    wirkenden Markierungen, daneben wenige handschriftlich wirkende Zeilen und ein QR-Code. Keine ausgedruckte Mail.

# Gegen Spamfilter (03.10.2026, Christians Wunsch): jede Mail etwas anders, wenig Masse, sauberer Absender.
spamschutz:
  abwechseln: [einstieg, betreff, aufhaenger, gruss] # je Mail eine andere Kombination; nie zwei gleiche Mails am selben Tag
  # 04.10.2026: mit Praxisname, das wird deutlich häufiger geöffnet als ein allgemeiner Betreff.
  # 04.10.2026 (Christian): kein Praxisname im Betreff, gleich das Anliegen. {firma} wäre weiter möglich.
  betreffe:
    - "Eine Idee für Ihre Startseite"
    - "Ein Entwurf für Ihre Website"
    - "Ihre Startseite, neu gedacht"
  aufhaenger_varianten:
    - Ich hab Ihnen dazu etwas vorbereitet und würde es gern kurz mit Ihnen durchgehen, 5 bis 10 Minuten reichen. Wann passt es Ihnen diese Woche am besten?
    - Dazu hab ich schon was vorbereitet. Hätten Sie diese Woche 10 Minuten, damit ich es Ihnen kurz zeigen kann?
    - Ich hab mir dazu schon Gedanken gemacht und etwas vorbereitet. Wann hätten Sie diese Woche kurz 5 bis 10 Minuten?
  gruesse: [Viele Grüße, Beste Grüße, Grüße aus Peißenberg, Liebe Grüße]
  regeln:
    - schlichter Text, kein HTML-Layout, kein Tracking-Pixel, keine Link-Kürzer; einzige Ausnahme ist das Vorschau-Bild
      der Startseite (04.10.2026, Physio), eingebettet unter seinem Satz
    - höchstens ein Link (WhatsApp-Business-Link oder Kalender), sonst keine Anhänge in der ersten Mail
    - keine Spam-Wörter (kostenlos, gratis, Angebot, Rabatt, garantiert, jetzt zuschlagen), keine Großbuchstaben-Wörter, kein "!!!"
    - persönliche Anrede mit Namen aus dem Impressum, sonst "Hallo zusammen" bzw. "Hallo Team {firma}"
    - "von Christians privatem Postfach (Adresse nur in der .env, OUTREACH_FROM), höchstens 10 bis 15 neue Mails am Tag, über den Tag verteilt"
    - avelio.digital hat SPF, DKIM (IONOS s1/s2) und DMARC p=none, wird aber bisher nicht zum Senden genutzt

# Kontaktweg (03.10.2026): nicht auf die eigene Website verweisen (passt noch nicht zum Anspruch), sondern auf
# WhatsApp Business (wa.me-Link mit vorausgefülltem Text) oder den Kalender-Link. Die Werte selbst stehen nicht im
# Repo, sondern in der .env auf dem Server (OUTREACH_PHONE, OUTREACH_WHATSAPP, OUTREACH_CALENDAR_URL).
kontaktweg:
  bevorzugt: whatsapp # alternativ: kalender
  whatsapp_text: Hallo Christian, ich hab deine Nachricht zu unserer Website bekommen.
  whatsapp_text_sie: Hallo Christian, ich habe Ihre Nachricht zu unserer Website bekommen.
  brief_qr: whatsapp # QR-Code auf der Befund-Seite öffnet WhatsApp mit vorausgefülltem Text
  email_cta: Am einfachsten antworten Sie kurz hier oder schreiben mir per WhatsApp ({whatsapp}).
  email_cta_du: Am einfachsten antwortest du kurz hier oder schreibst mir per WhatsApp ({whatsapp}).
  # Mit Prototyp (03.10.2026): Link zur Vorschau statt WhatsApp-Link (höchstens ein Link je Mail).
  entwurf_satz: "Ich hab mir auch schon mal erlaubt zu skizzieren, wie Ihre Startseite aussehen könnte: {link}"
  entwurf_satz_du: "Ich hab auch schon mal skizziert, wie eure Startseite aussehen könnte: {link}"
  # Mit Vorschau-Bild (04.10.2026, Physio): das Bild steht in der Mail direkt unter diesem Satz.
  # 05.10.2026 (Christian): das Bild als erste Skizze rahmen, die richtige Vorschau-Seite kommt erst auf Wunsch.
  bild_satz: "Ich hab mir deshalb erlaubt, eine erste Skizze Ihrer Startseite zu machen:"
  bild_satz_du: "Ich hab deshalb mal eine erste Skizze eurer Startseite gemacht:"
  email_cta_ohne_whatsapp: Am einfachsten antworten Sie kurz auf diese Mail.
  email_cta_ohne_whatsapp_du: Am einfachsten antwortest du kurz auf diese Mail.
  # Überleitung zum Terminvorschlag ("ich hab was vorbereitet"), wird abgewechselt.
  # 04.10.2026: kurz, "unverbindlich" steckt drin, danach direkt die Terminfrage.
  vorbereitet:
    - Ich hab dazu schon etwas vorbereitet und zeige es Ihnen gern in einem kurzen Video-Call, 10 Minuten, unverbindlich.
    - Dazu hab ich schon etwas vorbereitet, das zeige ich Ihnen gern in 10 Minuten per Video-Call am Bildschirm, ganz unverbindlich.
  # Mit Entwurf-Link davor: kein zweites "vorbereitet".
  vorbereitet_mit_entwurf:
    - Den Rest zeige ich Ihnen gern in einem kurzen Video-Call, 10 Minuten, unverbindlich.
    - Mehr dazu zeige ich Ihnen gern in 10 Minuten per Video-Call am Bildschirm, ganz unverbindlich.
  vorbereitet_mit_entwurf_du:
    - Den Rest zeig ich dir gern in einem kurzen Video-Call, 10 Minuten, unverbindlich.
    - Mehr dazu zeig ich dir gern in 10 Minuten per Video-Call am Bildschirm, ganz unverbindlich.
  vorbereitet_du:
    - Ich hab dazu schon was vorbereitet und zeig es dir gern in einem kurzen Video-Call, 10 Minuten, unverbindlich.
    - Dazu hab ich schon was vorbereitet, das zeig ich dir gern in 10 Minuten per Video-Call am Bildschirm, ganz unverbindlich.
  # Ablauf (05.10.2026, Christian: "deren Praxen sind voll, da nimmt sich der Chef keine 10 Minuten Video-Call"):
  # vorschau = keine Termine in der Erstmail; wer antwortet, bekommt eine echte Vorschau-Seite zum Anschauen, wann es
  # passt, das kurze Gespräch kommt erst danach. termin = wie bisher mit zwei Terminvorschlägen.
  ablauf: vorschau
  vorschau_angebot:
    - Das ist nur ein erster Eindruck. Wenn Sie mögen, baue ich daraus eine richtige Vorschau-Seite mit Ihren Leistungen und Ihrem Team, die Sie sich in Ruhe anschauen können, wann es Ihnen passt. Eine kurze Antwort genügt.
    - Die Skizze zeigt nur den Anfang. Gern baue ich Ihnen daraus eine echte Vorschau-Seite zum Durchklicken, ganz ohne Termin und unverbindlich. Sagen Sie einfach kurz Bescheid, dann lege ich los.
  vorschau_angebot_du:
    - Das ist nur ein erster Eindruck. Wenn du magst, bau ich daraus eine richtige Vorschau-Seite mit deinen Leistungen und deinem Team, die du dir in Ruhe anschauen kannst, wann es dir passt. Eine kurze Antwort genügt.
    - Die Skizze zeigt nur den Anfang. Gern bau ich dir daraus eine echte Vorschau-Seite zum Durchklicken, ganz ohne Termin und unverbindlich. Sag einfach kurz Bescheid, dann leg ich los.

# Terminvorschläge statt offenem Kalender (03.10.2026): Knappheit erzeugen, nicht "Mo bis Fr alles frei".
# Jede Nachricht schlägt 2 konkrete Tage mit je 2 Uhrzeiten vor, z. B. "Dienstag um 12 oder 18 Uhr, sonst Donnerstag
# um 8 oder 19:30". Avelio merkt sich angebotene Termine und bietet denselben Termin höchstens 2 Leads gleichzeitig an.
termine:
  # 04.10.2026 (Christian): Gespräche (5 bis 10 Minuten) gehen auch untertags, die Mittagspause plant er dann drumherum.
  # Physiopraxen haben meist zwischen 12 und 14 Uhr Pause, deshalb vor allem Mittags-, dazu Früh- und Abendtermine.
  zeitfenster: # Wochentag → mögliche Uhrzeiten (deutsche Zeit)
    montag: ["07:45", "12:15", "13:00", "18:00"]
    dienstag: ["08:00", "12:30", "13:15", "18:30"]
    mittwoch: ["07:45", "12:15", "13:00", "17:45"]
    donnerstag: ["08:00", "12:30", "13:15", "18:00"]
    freitag: ["07:45", "12:15", "13:00"]
  # Physio: Mittagspause der Praxis bevorzugen. Gastro hat abends Hochbetrieb: dort Morgentermine.
  branchen_bevorzugt:
    physiotherapie: ["12:15", "12:30", "13:00", "13:15"]
    gastro: ["07:45", "08:00", "17:45", "18:00"]
  tage_je_nachricht: 2
  uhrzeiten_je_tag: 1 # 04.10.2026: zwei konkrete Termine statt vier, eine klare Frage
  fruehestens_in_tagen: 2 # Vorlauf, damit die Antwort noch rechtzeitig kommt
  spaetestens_in_tagen: 9
  max_leads_je_termin: 5 # Antwortquote ~5–10 %, Doppelzusagen also selten; bei 2 wären die Termine nach ~7 Mails weg
  formulierungen_du:
    - Passt dir {tag1} um {zeit1a} Uhr oder {tag2} um {zeit2a} Uhr?
    - Hättest du {tag1} um {zeit1a} Uhr kurz Zeit? Sonst ginge auch {tag2} um {zeit2a} Uhr.
  formulierungen:
    - Passt Ihnen {tag1} um {zeit1a} Uhr oder {tag2} um {zeit2a} Uhr?
    - Hätten Sie {tag1} um {zeit1a} Uhr kurz Zeit? Sonst ginge auch {tag2} um {zeit2a} Uhr.

# Befund-Seite für Briefe (03.10.2026): ein Blatt A4, Umschlag schreibt Christian von Hand (wirkt persönlicher als
# ein Sichtfenster). Den Text unter dem Bild schreibt das LLM (prompts/letter.v1.md), den Rest setzt der Code.
brief:
  bildunterschrift: Ihre Startseite am Rechner, Stand {datum}
  bildunterschrift_du: Eure Startseite am Rechner, Stand {datum}
  qr_text: Kurz scannen, dann landen Sie direkt bei mir auf WhatsApp.
  qr_text_du: Kurz scannen, dann landest du direkt bei mir auf WhatsApp.
  qr_text_telefon: Oder einfach kurz anrufen.
  gruss: [Viele Grüße, Beste Grüße, Grüße aus Peißenberg]
  unterschrift: Christian

# Nachfass-Mail (03.10.2026): kurz, im selben Verlauf (Re: …), mit offenem Ausstieg. Text aus Code, kein LLM.
nachfassen:
  saetze:
    - ich wollte nur kurz nachhaken, ob meine Mail von letzter Woche bei Ihnen angekommen ist.
    - kurze Nachfrage zu meiner Mail von letzter Woche, ist die bei Ihnen gelandet?
  saetze_du:
    - ich wollte nur kurz nachhaken, ob meine Mail von letzter Woche bei dir angekommen ist.
    - kurze Nachfrage zu meiner Mail von letzter Woche, ist die bei dir gelandet?
  entwurf: "Den Entwurf für Ihre Startseite können Sie sich weiterhin hier ansehen: {link}"
  entwurf_du: "Den Entwurf für eure Startseite könnt ihr euch weiterhin hier ansehen: {link}"
  ausstieg: Wenn es gerade nicht passt, ist das völlig in Ordnung, dann melde ich mich nicht mehr.
  ausstieg_du: Wenn es gerade nicht passt, ist das völlig in Ordnung, dann melde ich mich nicht mehr.
