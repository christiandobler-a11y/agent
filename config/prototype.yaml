# Prototypen (Phase 3, 03.10.2026): Avelio baut aus einer Branchen-Vorlage und den Inhalten der alten Website einen
# Entwurf, den Christian zeigen kann. Gehostet auf dem eigenen Server (Caddy, docker-compose.prod.yml) unter
# PREVIEW_BASE_URL (z. B. https://vorschau.avelio.digital), nicht indexiert, nach keep_days gelöscht.
previews_dir: data/previews
shots_dir: data/preview-shots
keep_days: 60
# Branche → Vorlage (src/prototype/templates). Branchen ohne eigene Vorlage nutzen "fallback".
templates:
  physiotherapie: physio
  kosmetik: physio
  friseur: physio
  fahrrad: fahrrad
  maler: werkstatt
  schreiner: werkstatt
  sanitaer: werkstatt
  elektriker: werkstatt
  kfz: werkstatt
fallback: physio # Gastro und Hotel bekommen später eine eigene Vorlage

# Erstkontakt-Bild (04.10.2026, Christian: auf Physio spezialisieren, ein einheitliches starkes Hero, nur Name und Bild
# tauschen; der echte Prototyp entsteht erst bei Interesse). Kein LLM, kostet nichts. Für diese Branchen baut das
# Morgen-Paket statt eines Prototyps das Bild data/teasers/<Firmen-ID>.jpg; es steht in der Mail und auf der Befund-Seite.
teaser:
  dir: data/teasers
  branchen: [physiotherapie]
  # welt = helle Seite mit Foto-Collage und Google-Bewertung (angelehnt an therapie-welt.de),
  # vital = großes Foto mit Petrol-Schleier und Bogen (angelehnt an revitalis-physio.de),
  # rund = Pillen-Kopfleiste, ovales Foto, Leistungs-Kacheln (Vorbilder CORPORE und Burkart),
  # mix = am Rechner rund, am Handy vital mit den vier Leistungen als runde Kacheln darunter
  stil: rund # 04.10.2026 Christian: mix gefällt nicht, "lieber doch bei Version 1 bleiben" (rund)
  geraete: true # Startseite auf Laptop und Smartphone nebeneinander (alle Stile außer welt)
