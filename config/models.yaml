# Modell je Rolle (ARCHITECTURE.md 10) und Preise in $ je 1 Mio. Tokens.
roles:
  prefilter:
    model: claude-haiku-4-5
    max_tokens: 400
  # Modelle laut ARCHITECTURE.md 10:
  audit:
    model: claude-sonnet-5-5
    max_tokens: 8000 # inkl. Denkphase
    effort: low # ARCHITECTURE.md 10: Sonnet mit niedrigem Aufwand
    cache_system: true
  pitch:
    model: claude-opus-5-5
    max_tokens: 4000
    effort: low
  manager:
    model: claude-sonnet-5-5
    max_tokens: 4000 # inkl. Denkphase
    effort: low # Chat: kurze Antworten, Werkzeuge erledigen die Arbeit
    cache_system: true

  # Phase 2: Kontakt-Entwurf (E-Mail, Befund-Seite). Kurzer Text, Ton wichtig.
  contact:
    model: claude-sonnet-5-5
    max_tokens: 3000 # inkl. Denkphase
    effort: low
    cache_system: true

  # Befund-Seite (Brief): sieht den Screenshot, liefert Markierungen, Notizen und ein paar Zeilen.
  letter:
    model: claude-sonnet-5-5
    max_tokens: 3000 # inkl. Denkphase
    effort: low
    cache_system: true

  # Prototyp (Phase 3): Texte, Farbe und Fotowahl für die Vorlage; sieht den Screenshot der alten Seite.
  prototype:
    model: claude-sonnet-5-5
    max_tokens: 6000 # inkl. Denkphase
    effort: low
    cache_system: true

  # Hero-Foto (05.10.2026): wählt aus bis zu vier Fotos der Praxis-Website das passende für das Vorschau-Bild.
  hero:
    model: claude-sonnet-5-5
    max_tokens: 2000 # inkl. Denkphase
    effort: low

# Budget-Wächter: gilt für LLM-Aufrufe UND bezahlte APIs (Places) zusammen. Tag/Monat nach deutscher Zeit.
# Ist ein Limit erreicht, startet kein neuer kostenpflichtiger Aufruf mehr (laufende werden fertig).
budget:
  # 04.10.2026 (Christian): Testphase mit 20 → 30 → 45 Mails am Tag; Grenze für die Testphase ca. 150 €.
  # Tageslimit großzügig: die Nachtsuche läuft über Mitternacht und darf das Morgen-Paket (05:00) nicht ausbremsen.
  daily_usd: 15
  monthly_usd: 160

pricing:
  claude-haiku-4-5: { input: 1.0, output: 5.0, cache_read: 0.1 }
  claude-sonnet-5-5: { input: 2.0, output: 10.0, cache_read: 0.2 }
  claude-opus-5-5: { input: 4.0, output: 20.0, cache_read: 0.2 }
