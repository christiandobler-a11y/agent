# Modell je Rolle (ARCHITECTURE.md 10) und Preise in $ je 1 Mio. Tokens.
roles:
  prefilter:
    model: claude-haiku-4-5
    max_tokens: 400
  # Folgen in Schritt 6 und 8, Modelle laut ARCHITECTURE.md 10:
  audit:
    model: claude-sonnet-5-5
    max_tokens: 4000
  pitch:
    model: claude-opus-5-5
    max_tokens: 2000
  manager:
    model: claude-sonnet-5-5
    max_tokens: 2000

# Budget-Wächter: gilt für LLM-Aufrufe UND bezahlte APIs (Places) zusammen. Tag/Monat nach deutscher Zeit.
# Ist ein Limit erreicht, startet kein neuer kostenpflichtiger Aufruf mehr (laufende werden fertig).
budget:
  daily_usd: 5
  monthly_usd: 50

pricing:
  claude-haiku-4-5: { input: 1.0, output: 5.0, cache_read: 0.1 }
  claude-sonnet-5-5: { input: 2.0, output: 10.0, cache_read: 0.2 }
  claude-opus-5-5: { input: 4.0, output: 20.0, cache_read: 0.2 }
