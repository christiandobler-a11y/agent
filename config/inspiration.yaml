# Inspiration: Websites, die Christian als Vorbild für eine Branche gefallen. Grundlage für das Creative-Briefing
# und den Prototype-Agenten (Phase 3, ARCHITECTURE.md 14). Schlüssel = Branche aus config/branches.yaml.
# Neue Einträge: url, warum (Christians Worte), merkmale (was wir uns abschauen), gespeichert (Datum).

gastro:
  - url: https://www.zum-augustiner.de/
    name: Zum Augustiner Rosenheim
    warum: Gefällt mir sehr gut für bayerische Restaurants.
    merkmale:
      - Hero mit warmer Interieur-Fotografie und Dialekt-Slogan („So jung kemma nimma zam!“)
      - authentisch bayerische, lockere Tonalität, Dialekt stärkt die regionale Identität
      - klare Abschnitte in sinnvoller Reihenfolge – Wirtshaus, Spezialität (Holzfassanstich), Feiern/Events, Küche, Team, Kontakt
      - direkte Handlungsaufforderungen – Tisch reservieren (OpenTable), Speisekarte, Event-Anfrage, Telefon
      - minimalistisches, modernes Layout, das die Bilder wirken lässt
    gespeichert: 2026-10-03
  - url: https://maisonvy.de/
    name: Maison Vy Rosenheim (vietnamesisch)
    warum: Seite gefällt mir nicht zu 100 %, aber das Konzept der großen Speisekarte finde ich richtig gut.
    merkmale:
      - komplette Speisekarte direkt auf der Startseite statt PDF oder Unterseite
      - Mittagskarte (Di–Fr 11–14:30) getrennt von der vollen Karte
      - klare Kategorien (Vorspeisen, Suppen, Pho, Bun, Reis, Desserts) mit Preisen je Gericht
      - Anruf- und Reservieren-Button direkt erreichbar
      - nur das Speisekarten-Konzept übernehmen, nicht die Gestaltung insgesamt
    gespeichert: 2026-10-03
