# Inspiration: Websites, die Christian als Vorbild für eine Branche gefallen. Schlüssel "alle" = Gestaltungs-Elemente,
# die branchenübergreifend passen. Grundlage für das Creative-Briefing
# und den Prototype-Agenten (Phase 3, ARCHITECTURE.md 14). Sonstige Schlüssel = Branche aus config/branches.yaml;
# "unternehmen" gilt für Betriebe ohne Laden (Handwerk, Dienstleister), siehe src/prototype/run.ts.
# Neue Einträge: url, warum (Christians Worte), merkmale (was wir uns abschauen), gespeichert (Datum).

gastro:
  - url: https://www.zum-augustiner.de/
    name: Zum Augustiner Rosenheim
    warum: Gefällt mir sehr gut für bayerische Restaurants.
    merkmale:
      - Hero mit warmer Interieur-Fotografie und Dialekt-Slogan („So jung kemma nimma zam!“)
      - authentisch bayerische, lockere Tonalität, Dialekt stärkt die regionale Identität
      - klare Abschnitte in sinnvoller Reihenfolge – Wirtshaus, Spezialität (Holzfassanstich), Feiern/Events, Küche, Team, Kontakt
      - direkte Handlungsaufforderungen – Tisch reservieren (OpenTable), Speisekarte, Event-Anfrage, Telefon
      - minimalistisches, modernes Layout, das die Bilder wirken lässt
    gespeichert: 2026-10-03
  - url: https://maisonvy.de/
    name: Maison Vy Rosenheim (vietnamesisch)
    warum: Seite gefällt mir nicht zu 100 %, aber das Konzept der großen Speisekarte finde ich richtig gut.
    merkmale:
      - komplette Speisekarte direkt auf der Startseite statt PDF oder Unterseite
      - Mittagskarte (Di–Fr 11–14:30) getrennt von der vollen Karte
      - klare Kategorien (Vorspeisen, Suppen, Pho, Bun, Reis, Desserts) mit Preisen je Gericht
      - Anruf- und Reservieren-Button direkt erreichbar
      - nur das Speisekarten-Konzept übernehmen, nicht die Gestaltung insgesamt
    gespeichert: 2026-10-03

fahrrad:
  - url: https://fs-pbg.netlify.app/
    name: Fahrrad-Shop Peißenberg (Christians eigener Prototyp)
    warum: Unser Prototyp, gerne als Vorbild für Fahrradseiten.
    merkmale:
      - zweigeteilter Hero, links dunkle Fläche mit großer, fetter Versal-Überschrift, rechts echtes Foto aus dem Laden
      - ein Akzentwort in Markenfarbe und kursiv („DEIN NEUES BIKE BEGINNT HIER.“), kurzer Untertitel mit Leistungen
      - Kategorie-Kacheln mit Foto und Überschrift auf dem Bild (E-Bike, Mountainbike, Gravel, Rennrad)
      - nummerierte Abschnitte („01 Bike Worlds“, „02 Dienstrad-Leasing“), Wechsel aus dunklen und cremefarbenen Flächen
      - Leasing als eigener Abschnitt mit drei Schritten (aussuchen, Leasing nutzen, losfahren) und laufendem Partner-Band
      - Markenleiste unter dem Hero (Giant, Liv, Kalkhoff …), Adresse und Telefon immer sichtbar
    gespeichert: 2026-10-03

unternehmen:
  - url: https://hiwomed.de/
    name: HIWO-med (medizinischer Fachhandel, Uffing)
    warum: Gerne als Vorbild, wenn es Unternehmensseiten sind.
    merkmale:
      - Hero mit echtem Foto (Inhaber am eigenen Lieferwagen), Claim in zwei Tonstufen, persönlicher Satz in Anführungszeichen
      - Faktenleiste direkt unter dem Hero (Gegründet, Erreichbar, Lager) mit feinen Trennlinien
      - nummerierte Abschnitte mit kurzer Linie vor der Rubrik („02 — Warum HIWO-med“)
      - Gründe als nummerierte Liste mit Titel, zwei Sätzen und „Mehr zu …“-Link
      - dunkler Abschnitt „Eigenes Lager. Eigene Fahrzeuge. Eigene Leute.“ mit Tabelle der Liefergebiete
      - viel Weißraum, ruhige Typografie, Akzentfarbe nur für Linien und Links
    gespeichert: 2026-10-03

physiotherapie:
  - url: https://www.mediana-zentrum.de/
    name: MEDIANA Gesundheitszentrum (Stephanskirchen, Rosenheim, Prien)
    warum: Meiner Meinung nach eine sehr, sehr starke Website; die Übergänge zwischen den Sections sind super geworden.
    merkmale:
      - Hero mit großem Trainingsfoto, kurzer Claim in Versalien („Moderne Methoden. Menschlich umgesetzt.“) und ein klarer Button „Jetzt Termin buchen“
      - Section-Übergänge statt harter Kanten (Bergsilhouette, Papier-Risskanten), siehe Eintrag unter "alle"
      - eine starke Markenfarbe (Magenta) konsequent mit Schwarz, Weiß und Grau kombiniert, Handschrift-Claim „wir.mit.Dir.“
      - Leistungen als vier Kacheln mit Icon, Titel und einem Satz Nutzen
      - echte Teamfotos und Video statt Stockfotos, Mission und Vision kurz und persönlich
      - Kontakt-Section über einem Teamfoto mit allen drei Standorten und Telefonnummern
    gespeichert: 2026-10-03
  - url: https://www.corpore.health/
    name: Physiotherapie by CORPORE
    warum: >-
      Mir gefällt das "runde" Design, keine harten Kanten, oben der Header ist rund, selbst der Hero-Ausschnitt ist oval
      ausgeschnitten, ich finde das smooth. Online-Rezeption auch cool, natürlich nur auf Wunsch. Nicht 1:1 übernehmen.
    merkmale:
      - durchgehend runde Formen, keine harten Kanten (Karten, Buttons, Bilder mit großen Radien)
      - Kopfleiste als schwebende, abgerundete Pille über der Seite
      - Hero-Foto oval ausgeschnitten statt rechteckig oder randlos
      - Online-Terminanfrage bzw. Online-Rezeption als Option (nur wenn die Praxis das möchte)
    gespeichert: 2026-10-04
  - url: http://www.physio-burkart.de/
    name: Physiotherapie Burkart
    warum: >-
      Hero eindeutig zu viel Text, die restlichen Elemente finde ich gut. Ovaler Bildausschnitt im Hero, leichte
      Bewegung hoch/runter wirkt lebendig. Leistungen als einzelne Kacheln mit schönen Grafiken, die eine Unterseite
      öffnen, weitaus besser als reine Textform. Google-Bewertungen auch cool. Gut durchdachte Seite.
    merkmale:
      - ovaler Bildausschnitt im Hero mit sanfter Schwebe-Bewegung (langsam hoch und runter, CSS-Animation)
      - Leistungen als einzelne Kacheln mit Grafik/Icon, jede öffnet eine eigene Unterseite, kein reiner Fließtext
      - Google-Bewertungen sichtbar auf der Startseite
      - Hero-Text kurz halten (dort hatte Burkart zu viel Text)
    gespeichert: 2026-10-04
  - url: https://physio-lorre.de/
    name: Physiotherapie Vanessa Lorre (Köln-Ehrenfeld)
    warum: Inspo, finde ich suuuuper.
    merkmale:
      - Hero-Foto mit kräftigem Farbschleier in der Markenfarbe (Hellgrün), Text zentriert, Logo mittig in der Navigation
      - drei Häkchen-Vorteile direkt im Hero (freundliche Mitarbeiter, kurzfristige Termine, moderne Praxis), darunter ein klarer Termin-Button
      - schräge Kanten statt gerader Abschnittsgrenzen (V-förmiger Hero-Abschluss, schräge Farbflächen)
      - große Läufer-Grafik aus dem Logo, die über die Abschnittsgrenze ragt; schwebender runder Anruf-Knopf unten rechts
      - Laufband oben mit Büro- und Praxis-Öffnungszeiten; Inhaberin stellt sich mit Text und Unterschrift vor
      - Kontakt-Abschnitt mit Telefon groß, Öffnungszeiten und Google-Maps-Knopf über einem hellen Praxisfoto
    gespeichert: 2026-10-04
  - url: https://www.rebuild-physiotherapie.de/
    name: ReBuild Physiotherapie (Köln)
    warum: >-
      Definitiv als Inspo speichern für künftige Websites, perfektes Verhältnis aus Effekten, lebendiger Seite und
      guter Durchführung, sehr sehr geil.
    merkmale:
      - dunkles Design (Anthrazit) mit einer Akzentfarbe (Rot), riesige Schrift im Hero ("ReSet ReFocus ReBuild"), schräge Flächen im Hintergrund
      - Google-Sterne mit Anzahl und ein Satz zur Praxis unten rechts im Hero, zwei Pillen-Knöpfe
      - Kennzahlen-Leiste mit großen Zahlen und Häkchen (56 min Intensivtherapie, 2 Standorte, 1:1 Betreuung), Zahlen zählen beim Scrollen hoch
      - Leistungen als dunkle Karten mit echtem Foto, Titel, zwei Sätzen und Knopf "Mehr erfahren"
      - Vorteile mit 3D-Icons (Mikroskop, Stoppuhr, Laufband), "In 3 Schritten zum Erfolg" als Zeitleiste
      - Nachrichten-Laufband oben (Neueröffnung), Effekte sparsam, aber spürbar (Einblenden beim Scrollen)
    gespeichert: 2026-10-04

alle:
  - url: https://www.mediana-zentrum.de/
    name: Section-Übergang Bergsilhouette (MEDIANA)
    warum: Den Bergübergang mit drei Farben und Mustern finde ich brutal gut, er leitet perfekt in eine neue Section. Unbedingt merken.
    merkmale:
      - Hero-Foto endet unten in drei gestaffelten Bergkämmen (hellgrau, mittelgrau, Markenfarbe), die vorderste Ebene geht nahtlos in den Hintergrund der nächsten Section über
      - kleine Figur auf einem Gipfel als Blickfang, regionaler Bezug (Alpen, Chiemgau) passt ideal zu Kunden im Landkreis Rosenheim
      - weitere Übergänge als unregelmäßige Papier-Risskante (z. B. Magenta → Weiß, Weiß → Teamfoto)
      - umsetzbar mit gestapelten SVG-Pfaden (je Ebene eine Farbe) bzw. einer SVG-Maske, ohne Bilddateien
    gespeichert: 2026-10-03
