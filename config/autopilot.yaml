# Morgen-Paket (03.10.2026, mit Christian abgestimmt): Avelio bereitet nachts alles vor, morgens kommt in Telegram
# "Heute: 0/15", jede Nachricht mit einem Knopf zum Senden. Gesendet wird nur auf Knopfdruck.
zeiten:
  vorbereiten: "05:00" # Plan bauen (Prototypen, Mails, Befund-Seiten, Nachfassen); dauert bis zu einer Stunde
  morgens: "07:00" # Telegram-Nachricht "Heute: …"
  mittags: "12:00" # kurzer Zwischenstand ("Mahlzeit, Chef!"), 04.10.2026 Christians Wunsch
  abends: "19:00" # kurze Bilanz des Tages

# 04.10.2026 (Christian: mehr als 15, aber nicht im Spam landen): Die neue Adresse wird langsam aufgewärmt.
# Stufen nach Tagen seit der ersten gesendeten Mail; Spamfilter gewöhnen sich an den Absender.
neue_kontakte:
  stufen:
    - { ab_tag: 0, pro_tag: 20 }
    - { ab_tag: 7, pro_tag: 30 }
    - { ab_tag: 14, pro_tag: 45 }
  nur_werktags: true # Mo bis Fr; am Wochenende nur Nachfassen
  # Nur Leads dieser Branchen (04.10.2026: Fokus Physio). [] = alle Branchen. Von Christian vorgemerkte Leads
  # ("bereit für Kontakt") kommen immer dran.
  branchen: [physiotherapie]
  # Erst die Praxen in der Nähe (05.10.2026, Christian: "bei den ersten Kunden vor Ort überzeugen"), danach der Rest
  # nach Score. Umkreis um Peißenberg: Weilheim, Schongau, Penzberg, Murnau, Ammersee-Westufer.
  heimat: { ort: Peißenberg, lat: 47.7955, lng: 11.0645, umkreis_km: 30 }
  # Bremse: Kommen in den letzten `tage` Tagen mehr als `quote` der Mails als unzustellbar zurück (ab `mindestens`
  # gesendeten), geht es eine Stufe zurück und der Morgenbericht sagt es. Unzustellbare schaden dem Ruf am meisten.
  bremse: { quote: 0.05, mindestens: 20, tage: 7 }
# Befund-Seiten (Briefe), 04.10.2026 (Christian): Erstkontakt per Mail. Briefe gibt es für Leads ohne erreichbare
# Mail-Adresse und als zweites Nachfassen für sehr gute Leads (ab_score), wenn auch die Nachfass-Mail nach
# `nachfassen_nach_tagen` Tagen unbeantwortet blieb. 05.10.2026: Briefe zählen nicht zu den neuen Kontakten des Tages
# und werden gesammelt; sie kommen gebündelt an `tag` ins Morgen-Paket (höchstens `pro_woche`).
briefe:
  tag: samstag
  pro_woche: 15
  ab_score: 80
  nachfassen_nach_tagen: 7
prototyp_fuer_neue: true

nachfassen:
  nach_tagen: 5 # nach der ersten Mail ohne Antwort
  hoechstens: 1 # einmal nachfassen, danach Ruhe

# Nachtsuche (03.10.2026, Christians Wunsch: "der sucht das alles von alleine, ist er mit dem einen durch, geht er ans
# nächste"): Ab `ab` startet Avelio die nächste noch nicht vollständig abgesuchte Kombination aus Region × Branche
# als Komplett-Suche, höchstens `pro_nacht` je Nacht. Bricht eine Suche an der Kostenbremse ab, macht die nächste
# Nacht dort weiter. Neue Firmen werden automatisch gecrawlt und geprüft und landen im Morgen-Paket.
suche:
  aktiv: true
  ab: "22:00"
  pro_nacht: 1 # eine Komplett-Suche kostet grob 1 bis 3 $ (Google) plus Audits
  # Reihenfolge = Priorität. Regionen aus config/regions/, Branchen aus config/branches.yaml.
  # 04.10.2026 (Christian): erst einmal nur Physiotherapie, dafür mehr Regionen. Weitere Branchen später wieder dazu.
  regionen: [weilheim-schongau, rosenheim, starnberg, garmisch-partenkirchen]
  branchen: [physiotherapie]
