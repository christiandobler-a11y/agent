# Versand und Antwort-Erkennung über Christians eigenes Postfach (03.10.2026). Adresse und App-Passwort stehen nur in
# der .env auf dem Server (OUTREACH_MAIL_ADDRESS, OUTREACH_MAIL_PASSWORD, OUTREACH_MAIL_PROVIDER), nie im Repo.
# Avelio sendet nur auf Knopfdruck, nie von selbst.
providers:
  icloud:
    smtp: { host: smtp.mail.me.com, port: 587, secure: false }
    imap: { host: imap.mail.me.com, port: 993 }
    append_sent: true # iCloud legt per SMTP gesendete Mails nicht selbst unter "Gesendet" ab
  gmail:
    smtp: { host: smtp.gmail.com, port: 465, secure: true }
    imap: { host: imap.gmail.com, port: 993 }
    append_sent: false # Gmail speichert selbst
  gmx:
    smtp: { host: mail.gmx.net, port: 587, secure: false }
    imap: { host: imap.gmx.net, port: 993 }
    append_sent: true
  webde:
    smtp: { host: smtp.web.de, port: 587, secure: false }
    imap: { host: imap.web.de, port: 993 }
    append_sent: true
  ionos:
    smtp: { host: smtp.ionos.de, port: 587, secure: false }
    imap: { host: imap.ionos.de, port: 993 }
    append_sent: true

# Sicherheitsgrenze: mehr neue Mails (ohne Nachfassen) gehen an einem Tag nicht raus, egal was der Plan sagt.
max_per_day: 40
# Nur Antworten auf Mails der letzten so vielen Tage zuordnen.
reply_window_days: 60
