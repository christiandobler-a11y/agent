name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # 22 = .nvmrc, 24 = Server-Image und aktueller Mac (Node 24 ist z. B. bei AbortSignal strenger)
    strategy:
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: avelio
          POSTGRES_PASSWORD: avelio
          POSTGRES_DB: avelio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avelio -d avelio_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://avelio:avelio@localhost:5432/avelio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Echter Browser für die Crawl-Tests (tests/crawl-browser.test.ts)
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Server-Image (Schritt 9): baut es und startet Chromium darin einmal, ohne Keys und ohne Datenbank.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t avelio:ci .
      - run: docker run --rm --entrypoint node avelio:ci -e "import('playwright').then(async ({ chromium }) => { const b = await chromium.launch(); await b.close(); console.log('Chromium ok'); })"
